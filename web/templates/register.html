{% extends "base.html" %}
{% block title %}
{{ _('register') }}
{% endblock %}
{% block content %}
<div class="container">
    <a href="{{ url_for('auth.login') }}" id="login-link">{{ _('login')}}</a>
    <h1>{{ _('register') }}</h1>
    <form action="" method="post">
        <input type="text" name="{{ FORM_USERNAME }}" autocomplete="username" autocapitalize="false" placeholder="{{ _('username') }}" required>
        <input type="password" autocomplete="new-password" name="{{ FORM_PASSWORD }}" placeholder="{{ _('password') }}" required>
        <input type="password" autocomplete="new-password" name="{{ FORM_CONFIRM_PASSWORD }}" placeholder="{{ _('password.confirm') }}" required>
        <input type="submit" value="{{ _('register') }}">
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}
{{ _('register') }}
{% endblock %}
{% block content %}
<div class="container">
    <h1>{{ _('register') }}</h1>
    <form action="" method="post">
        <input type="text" name="username" autocomplete="username" autocapitalize="false" placeholder="{{ _('username') }}" required>
        <input type="password" autocomplete="new-password" name="password" placeholder="{{ _('password') }}" required>
        <input type="password" autocomplete="new-password" name="password-confirmation" placeholder="{{ _('password.confirm') }}" required>
        <input type="submit" value="{{ _('register') }}">
    </form>
</div>
{% endblock %}

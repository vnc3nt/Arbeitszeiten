<header id="topbar">
    <img src="{{ url_for('static', filename='img/appicons/512x512.png') }}" alt="Logo">
    <span>Arbeitszeiten</span>
</header>
{% with messages = get_flashed_messages(with_categories=true) %}
<ul id=flash-msg>
    {% for cat, msg in messages %}
    <li class="{{ cat }}" id="\f\m-{{loop.index}}">
        <input type="checkbox" id="fm-{{loop.index}}" class="flash-msg-toggle" checked />
        <span class="message">{{ msg }}</span>
        <label for="fm-{{loop.index}}">{{ _('flash.dismiss') }}</button>
    </li>
    {% endfor %}
</ul>
{% endwith %}

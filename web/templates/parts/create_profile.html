<form action="{{ url_for('form.create_profile_web') }}" method="post" aria-labelledby="create-profile-dialog">
    <h2 id="create-profile-dialog">{{ _('profile.create') }}</h2>
    <div class="input-box">
        <input type="text" placeholder="{{ _('profile.name') }}" name="{{ FORM_PROFILE_NAME }}" value="{{ gget(FORM_PROFILE_NAME) }}" required >
    </div>
    <div class="input-box">
        <label for="profile-color">{{ _('profile.color') }}</label>  
        <input type="color" id="profile-color" placeholder="farbe" name="{{ FORM_PROFILE_COLOR }}" value="{{ gget(FORM_PROFILE_COLOR) }}" required>
    </div>
    <div class="input-box">
        <label for="profile-date-start">{{ _('profile.date.start') }}</label>  
        <input type="date" id="profile-date-start" name="{{ FORM_WORK_START }}" value="{{ gget(FORM_WORK_START) }}" required>
    </div>
    <div class="input-box">
        <label for="profile-work-format">{{ _('work.timeformat') }}</label>
        <select name="{{ FORM_WORK_FORMAT }}" id="profile-work-format">
            {% for opt in WORK_TIME_FORMATS._value2member_map_ %}
            <option value="{{ opt }}" {{ 'selected' if loop.index == 1 and not gget(FORM_WORK_FORMAT) or gget(FORM_WORK_FORMAT) == opt }}>{{ _(opt) }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="input-box">
        <input type="number" name="{{ FORM_WORK_TIME }}" placeholder="{{ _('work.worktime_in_hour') }}" min="1" value="{{ gget(FORM_WORK_TIME) }}" required>
    </div>
    <button type="submit">{{ _('profile.create') }}</button>
</form>

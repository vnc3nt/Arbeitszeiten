<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="nofollow, index" />
        <meta name="author" content="Arbeitszeiten GMBH"/>
        <meta http-equiv="X-Frame-Options" content="deny">
        <meta name="Keywords" content="{{ _('website.kw') }}">
        <meta name="description" content="{{ _('website.desc') }}">
        <link rel="icon" href="{{ url_for('static', filename='img/appicons/512x512.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <title>{% block title required %}{% endblock %}</title>
</head>
<body>
    <a href="#content" id="main-content-link">Go to main content</a>
    {% include "parts/topbar.html" %}
    <main id="content">
        {% block content required %}
        {% endblock %}
    </main>
</body>

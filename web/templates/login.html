{% extends "base.html" %}
{% block title %}
{{ _('login') }}
{% endblock title %}
{% block content %}
<div class="container">
    <a href="{{ url_for('auth.register') }}" id="register-link">{{ _('register')}}</a>
    <h1>{{ _('login') }}</h1>
    <form action="" method="post">
        <input type=text name="{{ FORM_USERNAME }}" placeholder="{{ _('username') }}" value="{{ username }}" autocapitalize="false" autocomplete="username" required />
        <input type=password name="{{ FORM_PASSWORD }}" placeholder="{{ _('password') }}" value="" required />
        <input type="submit" value="{{ _('login') }}">
    </form>
</div>
{% endblock content %}
{% block footer %}
{% endblock %}

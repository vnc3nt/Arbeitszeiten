<div hx-get="{{ url_for('stats.period', period=previous) }}" hx-swap="afterend" hx-trigger="intersect once">
    <h2>{{ _(period.strftime("month.%m")) }} {{ period.year }}</h2>
    <ul>
        {% for entry in entries %}
        {% include "parts/work_entry.html" %}
        {% endfor %}
    </ul>
    <img src="{{ url_for('static', filename='img/spinner.svg') }}" alt="Loading..." width=30px class="htmx-indicator">
</div>

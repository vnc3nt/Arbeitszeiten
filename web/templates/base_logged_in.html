{% extends "base.html" %}
{% block header %}
<script type="text/javascript">
    let date = new Date();
    let offset = date.getTimezoneOffset();
    fetch(
        "/account/timezone",
         {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json",
            },
            body: `{"{{FORM_TIMEZONE_OFFSET}}":${offset}}`
         }
    ).then(resp => console.log(resp))
</script>
<script src="{{ url_for('static', filename='js/htmx.min.js') }}" type="text/javascript"></script>
{% endblock header %}
{% block footer %}
{% include "parts/navigation.html" %}
{% endblock footer %}

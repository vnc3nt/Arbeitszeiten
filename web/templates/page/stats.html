{% extends "base_logged_in.html" %}
{% block title %}
{{ profile.name }} | {{_("statistics.title")}}
{% endblock %}
{% block content %}
<h1>{{ profile.name }} | {{_("statistics.title")}}</h1>
<div hx-get="{{ url_for('stats.period') }}" hx-trigger="intersect once" hx-swap="innerHTML">
    <img src="{{ url_for('static', filename='img/spinner.svg') }}" id="stat-loading-indicator" alt="Loading..." width=30px class="htmx-indicator">
</div>
{% endblock %}

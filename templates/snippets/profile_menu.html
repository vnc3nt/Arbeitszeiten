<menu id="profile-menu">
    <ul>
        <li class="profile-selector-item">
            <form method="post" action="{{ url_for('switch_profile') }}">
                <label for="profile-selector">Arbeitsprofil</label>
                <select id="profile-selector" name="profile_id"
                        data-active-profile="{{ active_profile_id }}"
                        onchange="selectProfile(this)">
                    {% for profile in profiles %}
                    <option value="{{ profile.id }}" {% if profile.id == active_profile_id %}selected{% endif %}>
                        {{ profile.name }}
                    </option>
                    {% endfor %}
                    <option value="__new__">+ Neues Profil erstellen</option>
                </select>
            </form>
        </li>
        <a href="{{ url_for('profile') }}">
            <li>
                <div class="username"> {{ get_active_profile_name() }} </div>
            </li>
        </a>
        <a href="https://www.paypal.com/donate/?hosted_button_id=LDQM4GTCXJJR4">
            <li>
                <ul>
                    <img class="icon" src="{{url_for('static', filename='img/icons/96x96-heart.png')}}" alt="donate">
                </ul>
                <ul>
                    <div >Spenden</div>
                </ul>
            </li>
        </a>
        
    

        <a href="{{ url_for('logout') }}">
            <li>
                <ul>
                    <img class="icon" src="{{url_for('static', filename='img/icons/96x96-logout.png')}}" alt="logout">
                </ul>
                <ul>
                    <div class="logout">Abmelden</div>
                </ul>
            </li>
        </a>

        <div class="legal">
            <a href="{{ url_for('impressum') }}">
                <li>
                    <ul>Impressum</ul>
                </li>
            </a>
            <a href="{{ url_for('dpa') }}" download>
                <li>
                    <ul>Datenschutzerklärung</ul>
                </li>
            </a>
        </div>
        
    </ul>
</menu>

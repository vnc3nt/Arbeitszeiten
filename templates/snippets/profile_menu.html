<menu id="profile-menu">
    <ul>
        <li class="profile-menu-username">
            <div class="username">{{ get_username() }}</div>
        </li>
        <a href="https://www.paypal.com/donate/?hosted_button_id=LDQM4GTCXJJR4" rel="noopener noreferrer">
            <li>
                <ul>
                    <img class="icon" src="{{url_for('static', filename='img/icons/96x96-heart.png')}}" alt="donate">
                </ul>
                <ul>
                    <div>{{ t('menu.donate') }}</div>
                </ul>
            </li>
        </a>

        <a href="{{ url_for('profile') }}">
            <li>
                <ul>
                    <img class="icon" src="{{url_for('static', filename='img/icons/96x96-settings.png')}}" alt="settings">
                </ul>
                <ul>
                    <div>{{ t('menu.settings') }}</div>
                </ul>
            </li>
        </a>

        <form action="{{ url_for('logout') }}" method="post" style="margin: 0;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <button type="submit" style="all: unset; cursor: pointer; width: 100%; display: block;">
                <li>
                    <ul>
                        <img class="icon" src="{{url_for('static', filename='img/icons/96x96-logout.png')}}" alt="logout">
                    </ul>
                    <ul>
                        <div class="logout">{{ t('menu.logout') }}</div>
                    </ul>
                </li>
            </button>
        </form>

        <div class="legal">
            <a href="{{ url_for('impressum') }}">
                <li>
                    <ul>{{ t('menu.impressum') }}</ul>
                </li>
            </a>
            <a href="{{ url_for('dpa', lang=current_lang) }}" download>
                <li>
                    <ul>{{ t('menu.dpa') }}</ul>
                </li>
            </a>
            <a href="{{ url_for('agb', lang=current_lang) }}" download>
                <li>
                    <ul>{{ t('menu.agb') }}</ul>
                </li>
            </a>
        </div>
        
    </ul>
</menu>
